name: Test

on: [pull_request]

jobs:
  test-go115:
    runs-on: ubuntu-latest-large
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5  # v2
    - name: Set up Go
      uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492  # v2
      with:
        go-version: 1.15
    - name: Test
      run: |
        go mod vendor
        go test -v ./...

  test-go116:
    runs-on: ubuntu-latest-large
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5  # v2
    - name: Set up Go
      uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492  # v2
      with:
        go-version: 1.16
    - name: Test
      run: |
        go mod vendor
        go test -v ./...

  test-go117:
    runs-on: ubuntu-latest-large
    steps:
    - uses: actions/checkout@ee0669bd1cc54295c223e0bb666b733df41de1c5  # v2
    - name: Set up Go
      uses: actions/setup-go@bfdd3570ce990073878bf10f6b2d79082de49492  # v2
      with:
        go-version: 1.17
    - name: Test
      run: |
        go mod vendor
        go test -v ./...
